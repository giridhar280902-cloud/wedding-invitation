<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section id="welcome">

        <div class="luxury-card">

            <div class="monogram">A ♥ A</div>

            <h1>Arjun</h1>

            <div class="amp">&amp;</div>

            <h1>Aisha</h1>

            <p class="invite-text">
                You Are Cordially Invited
            </p>

            <button id="openBtn">
                Open Invitation
            </button>

        </div>

    </section>

    <section id="hero" class="hidden">

        <div class="overlay"></div>

        <div class="hero-content">

            <h2>Together With Their Families</h2>

            <h1 class="couple">
                Arjun
                <span>&amp;</span>
                Aisha
            </h1>

            <p>
                Request the honour of your presence
                at their wedding celebration.
            </p>

        </div>

    </section>

    <section>

        <h2 class="section-title">
            Save The Date
        </h2>

        <div class="date-boxes">

            <div>
                <span>14</span>
                <p>Day</p>
            </div>

            <div>
                <span>DEC</span>
                <p>Month</p>
            </div>

            <div>
                <span>2026</span>
                <p>Year</p>
            </div>

        </div>

        <div id="countdown"></div>

    </section>

    <section>

        <h2 class="section-title">
            Venue
        </h2>

        <img
            src="assets/images/venue.jpg"
            alt="Venue"
            class="venue-image">

        <h3>The Royal Palace</h3>

        <p>Mumbai, India</p>

        <a
            href="https://maps.google.com"
            target="_blank"
            class="button">
            View Location
        </a>

    </section>

    <section>

        <h2 class="section-title">
            Kindly RSVP
        </h2>

        <a
            href="https://forms.google.com"
            target="_blank"
            class="button">
            RSVP Now
        </a>

    </section>

    <button id="musicToggle">🔇</button>

    <audio id="music" loop>
        <source
            src="assets/audio/wedding-music.mp3"
            type="audio/mpeg">
    </audio>

    <script src="js/script.js"></script>

</body>

</html>
